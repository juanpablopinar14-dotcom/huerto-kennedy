<script>
/* ============================================================
   HUERTO KENNEDY · app (vanilla JS, sin build)
   ============================================================ */
const $  = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const main = $('main');
const CLP = n => '$'+(Math.round(n||0)).toLocaleString('es-CL');
const num = v => { const n=parseFloat(String(v??'').replace(',','.')); return isNaN(n)?0:n; };
const todayISO = ()=> new Date().toISOString().slice(0,10);
const uid = ()=> (crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random());
const VENTANA_COMPRAS = 3; // costo de compra = promedio ponderado por kg de las últimas N compras del producto

function toast(msg,ok=true){
  const t=$('#toast'); t.textContent=msg;
  t.className='fixed bottom-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-lg text-white text-sm shadow-lg '+(ok?'bg-emerald-600':'bg-red-600');
  t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),2200);
}
setInterval(()=>{ $('#clock').textContent=new Date().toLocaleString('es-CL',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); },1000);

/* ---------- STORAGE ABSTRACTION: Supabase o localStorage ---------- */
const useSB = SUPABASE_URL.startsWith('http') && !SUPABASE_ANON_KEY.startsWith('PEGAR');
let sb=null;
if(useSB){ sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }

const LS = {
  get:(k,def)=>{ try{return JSON.parse(localStorage.getItem('hk_'+k))??def}catch{return def} },
  set:(k,v)=>localStorage.setItem('hk_'+k,JSON.stringify(v)),
};

// API unificada. Cada método devuelve promesa.
const store = {
  mode: useSB?'supabase':'local',

  async productos(){
    if(useSB){ const {data,error}=await sb.from('productos').select('*').order('nombre'); if(error)throw error; return data; }
    return LS.get('productos', SEED_PRODUCTOS.map(p=>({id:uid(),activo:true,...p})));
  },
  async saveProducto(p){
    if(useSB){
      const row={...p}; if(!row.id) delete row.id; row.updated_at=new Date().toISOString();
      const {data,error}=await sb.from('productos').upsert(row).select().single(); if(error)throw error; return data;
    }
    let arr=await this.productos(); if(!p.id){p.id=uid(); arr.push(p);} else { arr=arr.map(x=>x.id===p.id?{...x,...p}:x); } LS.set('productos',arr); return p;
  },
  async deleteProducto(id){
    if(useSB){ const {error}=await sb.from('productos').delete().eq('id',id); if(error)throw error; return; }
    LS.set('productos',(await this.productos()).filter(x=>x.id!==id));
  },
  async logPrecio(producto_id,tipo,precio){
    if(useSB){ await sb.from('precio_historial').insert({producto_id,tipo,precio}); return; }
    const h=LS.get('precio_historial',[]); h.push({id:uid(),producto_id,tipo,precio,fecha:new Date().toISOString()}); LS.set('precio_historial',h);
  },

  async crearVenta(header,items){
    if(useSB){
      const {data:v,error:e1}=await sb.from('ventas').insert(header).select().single(); if(e1)throw e1;
      const rows=items.map(it=>({...it,venta_id:v.id})); const {error:e2}=await sb.from('venta_items').insert(rows); if(e2)throw e2; return v;
    }
    const ventas=LS.get('ventas',[]); const vi=LS.get('venta_items',[]);
    const v={id:uid(),created_at:new Date().toISOString(),...header}; ventas.push(v);
    items.forEach(it=>vi.push({id:uid(),venta_id:v.id,...it})); LS.set('ventas',ventas); LS.set('venta_items',vi); return v;
  },
  async ventasItems(desde,hasta){ // devuelve items con fecha de venta, para dashboard
    if(useSB){
      const {data,error}=await sb.from('venta_items').select('*, ventas!inner(fecha,total)').gte('ventas.fecha',desde).lte('ventas.fecha',hasta); if(error)throw error;
      return data.map(r=>({...r,fecha:r.ventas.fecha}));
    }
    const ventas=LS.get('ventas',[]); const map=Object.fromEntries(ventas.map(v=>[v.id,v.fecha]));
    return LS.get('venta_items',[]).map(it=>({...it,fecha:map[it.venta_id]})).filter(it=>it.fecha>=desde&&it.fecha<=hasta);
  },
  async ventasRecientes(n=20){
    if(useSB){ const {data,error}=await sb.from('ventas').select('*').order('created_at',{ascending:false}).limit(n); if(error)throw error; return data; }
    return LS.get('ventas',[]).sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,n);
  },

  async crearCompra(header,items){
    if(useSB){
      const {data:c,error:e1}=await sb.from('compras').insert(header).select().single(); if(e1)throw e1;
      const rows=items.map(it=>({...it,compra_id:c.id})); const {error:e2}=await sb.from('compra_items').insert(rows); if(e2)throw e2; return c;
    }
    const compras=LS.get('compras',[]); const ci=LS.get('compra_items',[]);
    const c={id:uid(),created_at:new Date().toISOString(),...header}; compras.push(c);
    items.forEach(it=>ci.push({id:uid(),compra_id:c.id,...it})); LS.set('compras',compras); LS.set('compra_items',ci); return c;
  },
  async comprasRecientes(n=30){
    if(useSB){ const {data,error}=await sb.from('compra_items').select('*, compras!inner(fecha,proveedor)').order('id',{ascending:false}).limit(n); if(error)throw error; return data.map(r=>({...r,fecha:r.compras.fecha,proveedor:r.compras.proveedor})); }
    const compras=LS.get('compras',[]); const map=Object.fromEntries(compras.map(c=>[c.id,c]));
    return LS.get('compra_items',[]).slice(-n).reverse().map(it=>({...it,fecha:map[it.compra_id]?.fecha,proveedor:map[it.compra_id]?.proveedor}));
  },

  async crearMerma(m){
    if(useSB){ const {data,error}=await sb.from('merma').insert(m).select().single(); if(error)throw error; return data; }
    const arr=LS.get('merma',[]); const row={id:uid(),created_at:new Date().toISOString(),...m}; arr.push(row); LS.set('merma',arr); return row;
  },
  async mermas(n=50){
    if(useSB){ const {data,error}=await sb.from('merma').select('*').order('fecha',{ascending:false}).limit(n); if(error)throw error; return data; }
    return LS.get('merma',[]).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')).slice(0,n);
  },

  async conversiones(){
    if(useSB){ const {data,error}=await sb.from('conversiones').select('*').order('formato'); if(error)throw error; return data; }
    return LS.get('conversiones', SEED_CONVERSIONES.map(c=>({id:uid(),...c})));
  },
  async saveConversion(c){
    if(useSB){ const row={...c}; if(!row.id)delete row.id; const {data,error}=await sb.from('conversiones').upsert(row).select().single(); if(error)throw error; return data; }
    let arr=await this.conversiones(); if(!c.id){c.id=uid();arr.push(c);}else arr=arr.map(x=>x.id===c.id?{...x,...c}:x); LS.set('conversiones',arr); return c;
  },
  async borrarConversion(id){
    if(useSB){ const {error}=await sb.from('conversiones').delete().eq('id',id); if(error)throw error; return; }
    LS.set('conversiones',(await this.conversiones()).filter(x=>x.id!==id));
  },

  // ---- MEMORIA / COSTO PONDERADO ----
  async comprasItemsDeProducto(producto_id, n=20){
    if(!producto_id) return [];
    if(useSB){
      const {data,error}=await sb.from('compra_items').select('*, compras!inner(fecha)').eq('producto_id',producto_id).order('id',{ascending:false}).limit(n);
      if(error)throw error; return data.map(r=>({...r,fecha:r.compras.fecha}));
    }
    const compras=LS.get('compras',[]); const map=Object.fromEntries(compras.map(c=>[c.id,c.fecha]));
    return LS.get('compra_items',[]).filter(it=>it.producto_id===producto_id).map(it=>({...it,fecha:map[it.compra_id]})).reverse().slice(0,n);
  },
  async ultimaCompraDe(producto_id){ const a=await this.comprasItemsDeProducto(producto_id,1); return a[0]||null; },
  async costoPonderado(producto_id, ventana=VENTANA_COMPRAS){
    const items=(await this.comprasItemsDeProducto(producto_id,ventana)).filter(x=>num(x.kg_equivalente)>0 && num(x.costo_total)>0);
    if(!items.length) return null;
    const kg=items.reduce((s,x)=>s+num(x.kg_equivalente),0);
    const costo=items.reduce((s,x)=>s+num(x.costo_total),0);
    return kg>0?Math.round(costo/kg):null;
  },

  // ---- VENTAS EN EFECTIVO (para cuadre de caja) ----
  async ventasEfectivoDia(fecha){
    if(useSB){ const {data,error}=await sb.from('ventas').select('total').eq('fecha',fecha).eq('medio_pago','efectivo'); if(error)throw error; return data.reduce((s,v)=>s+(v.total||0),0); }
    return LS.get('ventas',[]).filter(v=>v.fecha===fecha && v.medio_pago==='efectivo').reduce((s,v)=>s+(v.total||0),0);
  },

  // ---- LISTAS DE COMPRA ----
  async listas(){
    if(useSB){ const {data,error}=await sb.from('listas_compra').select('*').order('created_at',{ascending:false}); if(error)throw error; return data; }
    return LS.get('listas',[]).sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  },
  async listaItems(lista_id){
    if(useSB){ const {data,error}=await sb.from('lista_items').select('*').eq('lista_id',lista_id).order('id'); if(error)throw error; return data; }
    return LS.get('lista_items',[]).filter(x=>x.lista_id===lista_id);
  },
  async guardarLista(header, items){
    if(useSB){
      const row={...header}; if(!row.id)delete row.id;
      const {data:l,error:e1}=await sb.from('listas_compra').upsert(row).select().single(); if(e1)throw e1;
      await sb.from('lista_items').delete().eq('lista_id',l.id);
      if(items.length){ const rows=items.map(({id,...it})=>({producto_id:it.producto_id||null,nombre:it.nombre,formato_compra:it.formato_compra||null,kg_por_formato:it.kg_por_formato||null,cantidad_bruta:it.cantidad_bruta||0,costo_total:it.costo_total??null,lista_id:l.id})); const {error:e2}=await sb.from('lista_items').insert(rows); if(e2)throw e2; }
      return l;
    }
    let listas=LS.get('listas',[]); let l = header.id ? listas.find(x=>x.id===header.id) : null;
    if(l){ Object.assign(l,header); } else { l={id:uid(),created_at:new Date().toISOString(),...header}; listas.push(l); }
    LS.set('listas',listas);
    let li=LS.get('lista_items',[]).filter(x=>x.lista_id!==l.id);
    items.forEach(it=>li.push({id:uid(),lista_id:l.id,producto_id:it.producto_id||null,nombre:it.nombre,formato_compra:it.formato_compra||null,kg_por_formato:it.kg_por_formato||null,cantidad_bruta:it.cantidad_bruta||0,costo_total:it.costo_total??null}));
    LS.set('lista_items',li); return l;
  },
  async cerrarLista(id){
    if(useSB){ const {error}=await sb.from('listas_compra').update({estado:'cerrada'}).eq('id',id); if(error)throw error; return; }
    LS.set('listas',LS.get('listas',[]).map(x=>x.id===id?{...x,estado:'cerrada'}:x));
  },
  async borrarLista(id){
    if(useSB){ await sb.from('lista_items').delete().eq('lista_id',id); const {error}=await sb.from('listas_compra').delete().eq('id',id); if(error)throw error; return; }
    LS.set('listas',LS.get('listas',[]).filter(x=>x.id!==id));
    LS.set('lista_items',LS.get('lista_items',[]).filter(x=>x.lista_id!==id));
  },

  // ---- CIERRES DE CAJA ----
  async cierres(n=30){
    if(useSB){ const {data,error}=await sb.from('cierres_caja').select('*').order('fecha',{ascending:false}).limit(n); if(error)throw error; return data; }
    return LS.get('cierres',[]).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')).slice(0,n);
  },
  async guardarCierre(c){
    if(useSB){ const row={...c}; if(!row.id)delete row.id; const {data,error}=await sb.from('cierres_caja').upsert(row).select().single(); if(error)throw error; return data; }
    let arr=LS.get('cierres',[]); if(c.id){ arr=arr.map(x=>x.id===c.id?{...x,...c}:x); } else { c={id:uid(),created_at:new Date().toISOString(),...c}; arr.push(c);} LS.set('cierres',arr); return c;
  },
};

async function go(tab){
  $$('.tab').forEach(b=>b.classList.toggle('tab-active',b.dataset.tab===tab));
  $$('.tab').forEach(b=>{ if(b.dataset.tab!==tab) b.classList.add('bg-white'); else b.classList.remove('bg-white'); });
  main.innerHTML='<div class="text-center py-20 text-slate-400">cargando…</div>';
  try{ await tabs[tab](); }catch(e){ main.innerHTML='<div class="bg-red-100 text-red-700 p-4 rounded">Error: '+e.message+'</div>'; console.error(e); }
}

function paintSubmode(){
  $$('.subm').forEach(b=>{const a=b.dataset.sub===ventaSubmode; b.classList.toggle('bg-[var(--verde)]',a); b.classList.toggle('text-white',a);});
  const v=$('#subview');
  if(ventaSubmode==='seleccionar') return paintSeleccionar(v);
  if(ventaSubmode==='escanear')    return paintEscanear(v);
  if(ventaSubmode==='foto')        return paintFoto(v);
}

function paintSeleccionar(v){
  v.innerHTML=`
    <input id="qProd" placeholder="Buscar producto o código…" class="w-full border rounded-lg px-3 py-2 mb-2 shadow-sm">
    <div id="prodGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>`;
  const grid=$('#prodGrid');
  const paint=(f='')=>{
    const q=f.toLowerCase();
    grid.innerHTML = PRODS.filter(p=>p.activo!==false && (p.nombre.toLowerCase().includes(q)||String(p.codigo||'').includes(q)))
      .map(p=>`<button class="pcard text-left bg-white rounded-lg p-2 shadow-sm active:scale-95 transition" data-id="${p.id}">
        <div class="text-sm font-medium leading-tight">${p.nombre}</div>
        <div class="text-xs text-slate-400">${p.formato==='Peso'?'por kg':'unidad'} · ${p.codigo??'—'}</div>
        <div class="text-[var(--verde2)] font-bold text-sm mt-1">${CLP(p.precio_venta)}</div>
      </button>`).join('') || '<div class="col-span-full text-center text-slate-400 py-8">Sin resultados</div>';
    $$('.pcard',grid).forEach(b=>b.onclick=()=>addToCart(b.dataset.id));
  };
  paint(); $('#qProd').oninput=e=>paint(e.target.value);
}

function addToCart(id, cantidad=null){
  const p=PRODS.find(x=>x.id===id); if(!p)return;
  if(p.formato==='Peso' && cantidad===null){
    const kg=prompt(`${p.nombre} — kg vendidos:`,'1'); if(kg===null)return; cantidad=num(kg); if(cantidad<=0)return;
  } else if(cantidad===null){ cantidad=1; }
  const ex=cart.find(c=>c.id===id);
  if(ex && p.formato!=='Peso'){ ex.cantidad+=cantidad; }
  else if(ex && p.formato==='Peso'){ ex.cantidad=cantidad; }
  else cart.push({id:p.id,nombre:p.nombre,codigo:p.codigo,formato:p.formato,precio:p.precio_venta,compra:p.precio_compra,cantidad});
  paintCart(); toast(p.nombre+' agregado');
}
function paintCart(){
  const list=$('#cartList'); if(!list)return;
  if(!cart.length){ list.innerHTML='<div class="text-slate-400 text-sm text-center py-6">Carrito vacío</div>'; }
  else list.innerHTML=cart.map((c,i)=>{
    const imp=Math.round(c.precio*c.cantidad);
    return `<div class="flex items-center gap-2 text-sm">
      <div class="flex-1"><div class="font-medium leading-tight">${c.nombre}</div>
        <div class="text-xs text-slate-400">${CLP(c.precio)} × 
          <input data-i="${i}" class="qty w-16 border rounded px-1 text-center" value="${c.cantidad}"> ${c.formato==='Peso'?'kg':'un'}</div>
      </div>
      <div class="font-semibold">${CLP(imp)}</div>
      <button data-del="${i}" class="text-red-400 px-1">✕</button></div>`;
  }).join('');
  $$('.qty',list).forEach(inp=>inp.onchange=e=>{cart[e.target.dataset.i].cantidad=num(e.target.value);paintCart();});
  $$('[data-del]',list).forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.del,1);paintCart();});
  const total=cart.reduce((s,c)=>s+c.precio*c.cantidad,0);
  $('#cartTotal').textContent=CLP(total); $('#cartCount').textContent=cart.length?`${cart.length} ítems`:'';
}
async function pagar(){
  if(!cart.length){toast('Carrito vacío',false);return;}
  const total=Math.round(cart.reduce((s,c)=>s+c.precio*c.cantidad,0));
  const items=cart.map(c=>({producto_id:isUUID(c.id)?c.id:null,codigo_snapshot:c.codigo??null,nombre_snapshot:c.nombre,
    formato:c.formato,cantidad:c.cantidad,precio_unitario:Math.round(c.precio),
    precio_compra_snapshot:c.compra??null,importe:Math.round(c.precio*c.cantidad)}));
  try{
    await store.crearVenta({fecha:todayISO(),total,medio_pago:$('#medioPago').value,origen:ventaSubmode==='foto'?'foto':(ventaSubmode==='escanear'?'scan':'manual')},items);
    toast('Venta registrada '+CLP(total)); cart.length=0; paintCart();
  }catch(e){toast('Error al guardar: '+e.message,false);}
}
const isUUID=s=>/^[0-9a-f]{8}-[0-9a-f]{4}-/.test(String(s));

/* ----- Escanear con cámara (barcode -> match por codigo) ----- */
let scanner=null;
function paintEscanear(v){
  v.innerHTML=`<div class="bg-white rounded-xl shadow-sm p-3">
    <div id="reader" class="rounded-lg overflow-hidden"></div>
    <p class="text-xs text-slate-400 mt-2">Apunta al código de barras. Se busca por el campo <b>código</b> del producto.</p>
    <input id="manualCode" placeholder="…o escribe el código y Enter" class="w-full border rounded-lg px-3 py-2 mt-2">
  </div>`;
  $('#manualCode').onkeydown=e=>{ if(e.key==='Enter'){ matchCode(e.target.value.trim()); e.target.value=''; } };
  if(typeof Html5Qrcode==='undefined'){ $('#reader').innerHTML='<div class="text-slate-400 text-sm p-4 text-center">Escáner no disponible</div>'; return; }
  scanner=new Html5Qrcode('reader');
  scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},
    txt=>{ matchCode(txt); },()=>{}).catch(()=>{ $('#reader').innerHTML='<div class="text-slate-400 text-sm p-4 text-center">No se pudo abrir la cámara (permiso denegado o navegador sin soporte)</div>'; });
}
function matchCode(code){
  const c=code.replace(/^0+/,''); // quita ceros a la izquierda
  const p=PRODS.find(x=>String(x.codigo)===code||String(x.codigo)===c);
  if(p){ addToCart(p.id); } else toast('Código '+code+' no encontrado',false);
}

/* ----- Foto / lectura de ticket con IA (Gemini gratis o Anthropic) ----- */
const getAIKey=()=>localStorage.getItem('hk_ai_key')||'';
const getAIProv=()=>localStorage.getItem('hk_ai_prov')||'gemini';
function promptTicket(){
  const catalogo=PRODS.map(p=>`${p.id} | cod:${p.codigo??'-'} | ${p.nombre} | ${p.formato}`).join('\n');
  return `Eres el sistema de caja de una verdulería en Chile. Te paso la foto de un ticket o listado de una balanza (columnas: CODIGO, PLU, DENOMINACION y debajo OPERACIONES, PESO, IMPORTE) y el catálogo de productos.
Devuelve SOLO un JSON válido, sin texto ni markdown:
{"items":[{"producto_id":"<id del catálogo o null>","codigo":<numero o null>,"nombre":"<denominación leída>","cantidad":<numero>,"importe":<numero o null>}]}
Reglas:
- Cada producto ocupa 2 renglones: arriba "CODIGO PLU DENOMINACION", abajo "OPERACIONES PESO IMPORTE".
- "codigo" = la columna CODIGO de la izquierda, quitando SOLO los ceros a la izquierda (000004 -> 4, 000137 -> 137, 010001 -> 10001, 010025 -> 10025).
- Cruza cada línea con el catálogo por ese codigo; si no calza, por el nombre más parecido. Usa el id del catálogo cuando haya match.
- "cantidad": si el producto es formato Peso, usa el PESO en kg (2,580 -> 2.58). Si es Unidad, usa OPERACIONES.
- "importe": el monto en pesos de esa línea (4102), o null.
- Los números traen coma decimal: conviértela a punto. Ignora encabezados, totales y líneas como "CODIGOS: 15".

CATÁLOGO (id | codigo | nombre | formato):
${catalogo}`;
}
async function analizarImagenGemini(b64){
  const key=getAIKey(); if(!key) throw new Error('Falta la API key');
  const url='https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key='+encodeURIComponent(key);
  const resp=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:'image/jpeg',data:b64}},{text:promptTicket()}]}]})});
  if(!resp.ok){ const t=await resp.text(); throw new Error('API '+resp.status+' · '+t.slice(0,160)); }
  const data=await resp.json();
  const text=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
  return JSON.parse(text.replace(/```json|```/g,'').trim());
}
async function analizarImagenAnthropic(b64){
  const key=getAIKey(); if(!key) throw new Error('Falta la API key');
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,messages:[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
      {type:'text',text:promptTicket()}]}]})
  });
  if(!resp.ok){ const t=await resp.text(); throw new Error('API '+resp.status+' · '+t.slice(0,160)); }
  const data=await resp.json();
  const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  return JSON.parse(text.replace(/```json|```/g,'').trim());
}

const fileToB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});

    </table></div>
   </div>`;
  const margen=p=>p.precio_compra?Math.round((1-p.precio_compra/p.precio_venta)*100):null;
  const arrow=k=> k===sortKey ? (sortDir>0?' ▲':' ▼') : '';
  const paint=(f='')=>{
    const q=f.toLowerCase();
    let rows=PRODS.filter(p=>p.nombre.toLowerCase().includes(q)||String(p.codigo||'').includes(q));
    rows.sort((a,b)=>{

    <span>${CLP(b.costo_total)} · ${CLP(b.costo_unitario_kg)}/${b._unidad==='un'?'un':'kg'} <button data-d="${i}" class="text-red-400 ml-1">✕</button></span></div>`).join('');
    $$('#itemsBuf [data-d]').forEach(x=>x.onclick=()=>{buf.splice(+x.dataset.d,1);paintBuf();}); }

  $('#saveCompra').onclick=async()=>{
    if(!buf.length){toast('Agrega al menos un ítem',false);return;}
    const total=buf.reduce((s,b)=>s+b.costo_total,0);
    try{
      await store.crearCompra({fecha:$('#cFecha').value,proveedor:$('#cProv').value||null,total},
        buf.map(({_upd,_unidad,...rest})=>rest));
      for(const b of buf){ if(b._upd && b.producto_id){ const pond=await store.costoPonderado(b.producto_id); if(pond){ await store.saveProducto({id:b.producto_id,precio_compra:pond}); await store.logPrecio(b.producto_id,'compra',pond); } } }
      toast('Compra guardada '+CLP(total)); buf.length=0; paintBuf(); await refreshProds(); loadHist();

  function pintarFmtEditor(){

      <button class="fdel text-red-400 px-1">🗑️</button></div>`).join('')||'<div class="text-slate-400">Sin formatos aún</div>';
    $$('#fmtEditor [data-fid]').forEach(row=>{
      const id=row.dataset.fid;
      row.querySelector('.fsave').onclick=async()=>{ await store.saveConversion({id,formato:row.querySelector('.fnom').value.trim(),kg:num(row.querySelector('.fkg').value)}); await refreshConvs(); toast('Formato guardado'); pintarFmtEditor(); if($('#iModo').value==='formato')pintarCampos(); };
      row.querySelector('.fdel').onclick=async()=>{ if(!confirm('¿Eliminar formato?'))return; await store.borrarConversion(id); await refreshConvs(); toast('Eliminado'); pintarFmtEditor(); if($('#iModo').value==='formato')pintarCampos(); };
    });
  }
  $('#fmtAdd').onclick=async()=>{ const n=$('#fmtNombre').value.trim(); const k=num($('#fmtKg').value); if(!n||!k){toast('Escribe nombre y kg del formato',false);return;} await store.saveConversion({formato:n,kg:k}); await refreshConvs(); $('#fmtNombre').value='';$('#fmtKg').value=''; toast('Formato agregado'); pintarFmtEditor(); if($('#iModo').value==='formato')pintarCampos(); };
  pintarFmtEditor();

  async function loadHist(){ const h=await store.comprasRecientes(40);
    $('#compHist').innerHTML=h.map(c=>{ const u=c.formato_compra==='unidad'?'un':'kg';
      return `<div class="border-b last:border-0 py-1"><div class="flex justify-between"><span class="font-medium">${c.nombre}</span><span>${CLP(c.costo_total)}</span></div>
      <div class="text-xs text-slate-400">${c.fecha||''} · ${c.kg_equivalente}${u} · ${CLP(c.costo_unitario_kg)}/${u}${c.proveedor?' · '+c.proveedor:''}</div></div>`; }).join('')||'<div class="text-slate-400">Sin compras</div>'; }
  loadHist();
}

async function renderDashboard(){
  const hasta=todayISO(); const d=new Date(); d.setDate(d.getDate()-30); const desde=d.toISOString().slice(0,10);
  main.innerHTML=`
   <div class="bg-white rounded-xl shadow-sm p-3 mb-3 flex flex-wrap gap-2 items-end text-sm">
     <label>Desde<input id="dDesde" type="date" value="${desde}" class="block border rounded-lg px-2 py-2"></label>
     <label>Hasta<input id="dHasta" type="date" value="${hasta}" class="block border rounded-lg px-2 py-2"></label>
     <button id="dGo" class="px-4 py-2 rounded-lg bg-[var(--verde)] text-white font-bold">Actualizar</button>
   </div>
   <div id="kpis" class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3"></div>
   <div class="grid lg:grid-cols-2 gap-3 mb-3">
     <div class="bg-white rounded-xl shadow-sm p-3"><div class="font-bold text-emerald-700 mb-2">🏆 Más ganan ($ margen)</div><div id="topWin"></div></div>
     <div class="bg-white rounded-xl shadow-sm p-3"><div class="font-bold text-red-600 mb-2">🩸 Pierden o margen bajo</div><div id="topLose"></div></div>
   </div>
   <div class="bg-white rounded-xl shadow-sm p-3 overflow-x-auto">
     <div class="font-bold mb-2">Detalle por producto</div>
     <table class="w-full text-sm"><thead class="text-left text-slate-400 border-b">
       <tr><th class="py-2 pr-2">Producto</th><th class="text-right pr-2">Vendido</th><th class="text-right pr-2">Ingresos</th><th class="text-right pr-2">Costo</th><th class="text-right pr-2">Margen $</th><th class="text-right">Margen %</th></tr>
     </thead><tbody id="dBody"></tbody></table>
   </div>`;
  $('#dGo').onclick=load; await load();

  async function load(){
    const items=await store.ventasItems($('#dDesde').value,$('#dHasta').value);
    const map={};
    items.forEach(it=>{
      const k=it.nombre_snapshot;
      map[k]=map[k]||{nombre:k,cant:0,ing:0,cost:0};
      map[k].cant+=num(it.cantidad); map[k].ing+=it.importe;
      map[k].cost+=num(it.cantidad)*(it.precio_compra_snapshot||0);
    });
    const rows=Object.values(map).map(r=>({...r,margen:r.ing-r.cost,mpct:r.ing?(r.ing-r.cost)/r.ing*100:0})).sort((a,b)=>b.margen-a.margen);
    const tIng=rows.reduce((s,r)=>s+r.ing,0), tCost=rows.reduce((s,r)=>s+r.cost,0), tMg=tIng-tCost;
    const sinCosto=rows.filter(r=>r.cost===0&&r.ing>0).length;
    $('#kpis').innerHTML=[
      ['Ingresos',CLP(tIng),'text-slate-800'],['Costo (COGS)',CLP(tCost),'text-slate-800'],
      ['Margen bruto',CLP(tMg),tMg>=0?'text-emerald-600':'text-red-600'],
      ['Margen %',(tIng?Math.round(tMg/tIng*100):0)+'%',tMg>=0?'text-emerald-600':'text-red-600']
    ].map(([l,v,c])=>`<div class="bg-white rounded-xl shadow-sm p-3"><div class="text-xs text-slate-400">${l}</div><div class="text-xl font-bold ${c}">${v}</div></div>`).join('');

    const bar=(r,max)=>`<div class="flex items-center gap-2 py-1 text-sm"><div class="w-28 truncate">${r.nombre}</div>
      <div class="flex-1 bg-slate-100 rounded h-4 relative"><div class="h-4 rounded ${r.margen>=0?'bg-emerald-400':'bg-red-400'}" style="width:${Math.max(4,Math.abs(r.margen)/max*100)}%"></div></div>
      <div class="w-20 text-right ${r.margen<0?'text-red-600':''}">${CLP(r.margen)}</div></div>`;
    const maxAbs=Math.max(1,...rows.map(r=>Math.abs(r.margen)));
    $('#topWin').innerHTML=rows.slice(0,8).map(r=>bar(r,maxAbs)).join('')||'<div class="text-slate-400 text-sm">Sin ventas en el rango</div>';
    $('#topLose').innerHTML=[...rows].reverse().slice(0,8).map(r=>bar(r,maxAbs)).join('')||'<div class="text-slate-400 text-sm">—</div>';

    $('#dBody').innerHTML=rows.map(r=>`<tr class="border-b last:border-0">
      <td class="py-1 pr-2">${r.nombre}</td><td class="text-right pr-2">${r.cant.toLocaleString('es-CL')}</td>
      <td class="text-right pr-2">${CLP(r.ing)}</td><td class="text-right pr-2 ${r.cost===0?'text-amber-500':''}">${CLP(r.cost)}</td>
      <td class="text-right pr-2 font-semibold ${r.margen<0?'text-red-600':'text-emerald-700'}">${CLP(r.margen)}</td>
      <td class="text-right ${r.mpct<0?'text-red-600':''}">${Math.round(r.mpct)}%</td></tr>`).join('')||'<tr><td colspan="6" class="text-center text-slate-400 py-6">Sin ventas en el rango</td></tr>';
    if(sinCosto) toast(sinCosto+' producto(s) sin costo cargado — el margen los sobreestima',false);
  }
}

let listaActual=null; // {header:{...}, items:[...]}
async function renderLista(){
  await refreshProds(); await refreshConvs();
  main.innerHTML=`
  <div class="bg-emerald-50 text-emerald-900 text-sm rounded-xl p-3 mb-3">
    <b>¿Cómo funciona?</b> &nbsp;1) Arma la lista con lo que vas a comprar y cuánto. &nbsp;2) En el mercado, escribe el precio que pagaste y ajusta cantidades. &nbsp;3) Cuando esté todo listo, aprieta <b>✅ Cerrar como compra</b> y queda registrado en Compras.
  </div>
  <div class="grid lg:grid-cols-3 gap-3">
    <div class="lg:col-span-2 bg-white rounded-xl shadow-sm p-4 space-y-3">
      <div class="flex items-center gap-2">
        <input id="lNombre" placeholder="Nombre de la lista (ej: Compra del martes)" class="border rounded-lg px-2 py-2 text-sm flex-1">
        <button id="lNueva" class="px-3 py-2 rounded-lg bg-slate-100 text-sm font-medium whitespace-nowrap">🗒️ Nueva</button>
      </div>
      <div class="overflow-x-auto">
      <table class="w-full text-sm"><thead class="text-left text-slate-400 border-b">
        <tr><th class="py-2 pr-2">Producto</th><th class="pr-2">Cantidad</th><th class="pr-2">Formato</th><th class="pr-2 text-right">Precio pagado $</th><th></th></tr>
      </thead><tbody id="lBody"></tbody></table></div>
      <div class="grid grid-cols-4 gap-2 text-sm items-end border-t pt-3">
        <label class="col-span-2">Agregar producto<input id="lProd" list="lProdList" placeholder="ej: Tomate" class="w-full border rounded-lg px-2 py-2"><datalist id="lProdList">${PRODS.map(p=>`<option value="${p.nombre}">`).join('')}</datalist></label>
        <label>Cantidad<input id="lCant" type="number" step="0.01" value="1" class="w-full border rounded-lg px-2 py-2"></label>
        <label>Formato<input id="lFmt" list="lFmtList" placeholder="caja…" class="w-full border rounded-lg px-2 py-2"><datalist id="lFmtList">${CONVS.map(c=>`<option value="${c.formato}">`).join('')}</datalist></label>
      </div>
      <button id="lAdd" class="w-full py-2 rounded-lg bg-slate-100 text-sm font-medium">+ Agregar a la lista</button>
      <div class="border-t pt-3 flex flex-wrap gap-2 items-center justify-between">
        <div class="text-sm">Total estimado: <b id="lTotal">$0</b></div>
        <div class="flex gap-2">
          <button id="lSave" class="px-3 py-2 rounded-lg bg-slate-200 text-sm font-medium">💾 Guardar borrador</button>
          <button id="lClose" class="px-3 py-2 rounded-lg bg-[var(--verde)] text-white text-sm font-bold">✅ Cerrar como compra</button>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-4">
      <div class="font-bold mb-2">Mis listas</div>
      <div id="lHist" class="text-sm space-y-1 max-h-[70vh] overflow-y-auto"></div>
    </div>
  </div>`;

  const kgAuto=f=>{ const c=CONVS.find(x=>x.formato.toLowerCase()===(f||'').toLowerCase()); return c?c.kg:null; };
  if(!listaActual) nuevaLista();
  pintarLista(); cargarHist();

  function nuevaLista(){ listaActual={header:{estado:'borrador', fecha:todayISO(), nombre:''}, items:[]}; }
  function totalEst(){ const t=listaActual.items.reduce((s,it)=>s+(it.costo_total||0),0); $('#lTotal').textContent=CLP(t); }
  function pintarLista(){
    $('#lNombre').value=listaActual.header.nombre||'';
    $('#lBody').innerHTML=listaActual.items.map((it,i)=>`<tr class="border-b last:border-0">
      <td class="py-1 pr-2">${it.nombre}</td>
      <td class="pr-2"><input data-i="${i}" class="lc cant w-16 border rounded px-1 py-1" value="${it.cantidad_bruta}"></td>
      <td class="pr-2 text-slate-500">${it.formato_compra||'—'}</td>
      <td class="pr-2 text-right"><input data-i="${i}" class="lc costo w-24 text-right border rounded px-1 py-1" placeholder="—" value="${it.costo_total??''}"></td>
      <td class="text-right"><button data-del="${i}" class="text-red-400 px-1">✕</button></td></tr>`).join('')
      || '<tr><td colspan="5" class="text-center text-slate-400 py-4">Lista vacía. Agrega productos abajo 👇</td></tr>';
    $$('#lBody .lc.cant').forEach(el=>el.onchange=()=>{ listaActual.items[+el.dataset.i].cantidad_bruta=num(el.value); totalEst(); });
    $$('#lBody .lc.costo').forEach(el=>el.onchange=()=>{ listaActual.items[+el.dataset.i].costo_total = el.value===''?null:Math.round(num(el.value)); totalEst(); });
    $$('#lBody [data-del]').forEach(el=>el.onclick=()=>{ listaActual.items.splice(+el.dataset.del,1); pintarLista(); });
    totalEst();
  }

  $('#lNombre').onchange=()=>{ listaActual.header.nombre=$('#lNombre').value.trim(); };
  $('#lNueva').onclick=()=>{ if(listaActual.items.length && !confirm('¿Empezar una lista nueva? Si no guardaste la actual, la perderás.'))return; nuevaLista(); pintarLista(); };
  $('#lAdd').onclick=()=>{
    const nombre=$('#lProd').value.trim(); if(!nombre){toast('Escribe un producto',false);return;}
    const p=PRODS.find(x=>x.nombre.toLowerCase()===nombre.toLowerCase());
    const fmt=$('#lFmt').value.trim()||null;
    listaActual.items.push({producto_id:p?.id||null, nombre, formato_compra:fmt, kg_por_formato:kgAuto(fmt), cantidad_bruta:num($('#lCant').value)||1, costo_total:null});
    $('#lProd').value='';$('#lFmt').value='';$('#lCant').value='1'; pintarLista();
  };
  $('#lSave').onclick=async()=>{
    listaActual.header.nombre=$('#lNombre').value.trim();
    try{ const l=await store.guardarLista(listaActual.header, listaActual.items); listaActual.header.id=l.id; toast('Borrador guardado'); cargarHist(); }
    catch(e){toast('Error: '+e.message,false);}
  };
  $('#lClose').onclick=async()=>{
    if(!listaActual.items.length){toast('La lista está vacía',false);return;}
    const faltan=listaActual.items.filter(it=>it.costo_total==null||it.costo_total<=0);
    if(faltan.length && !confirm(faltan.length+' producto(s) sin precio. Se ignorarán al registrar la compra. ¿Continuar?'))return;
    const validos=listaActual.items.filter(it=>it.costo_total>0);
    if(!validos.length){toast('Ningún producto con precio para registrar',false);return;}
    const compraItems=validos.map(it=>{ const kg=it.kg_por_formato||kgAuto(it.formato_compra)||0; const kgEq=(it.cantidad_bruta||0)*kg; const cu=kgEq>0?Math.round(it.costo_total/kgEq):null;
      return {producto_id:it.producto_id, nombre:it.nombre, formato_compra:it.formato_compra, cantidad_bruta:it.cantidad_bruta, kg_por_formato:kg||null, kg_equivalente:kgEq, costo_total:it.costo_total, costo_unitario_kg:cu}; });
    const total=compraItems.reduce((s,b)=>s+b.costo_total,0);
    try{
      listaActual.header.nombre=$('#lNombre').value.trim();
      const l=await store.guardarLista(listaActual.header, listaActual.items); listaActual.header.id=l.id;
      await store.crearCompra({fecha:listaActual.header.fecha||todayISO(), proveedor:'Lo Valledor', total}, compraItems);
      for(const b of compraItems){ if(b.producto_id){ const pond=await store.costoPonderado(b.producto_id); if(pond){ await store.saveProducto({id:b.producto_id,precio_compra:pond}); await store.logPrecio(b.producto_id,'compra',pond); } } }
      await store.cerrarLista(listaActual.header.id);
      toast('✅ Compra registrada '+CLP(total)); await refreshProds(); nuevaLista(); pintarLista(); cargarHist();
    }catch(e){toast('Error: '+e.message,false);}
  };

  async function cargarHist(){
    const ls=await store.listas();
    $('#lHist').innerHTML = ls.map(l=>{
      const abierta=l.estado!=='cerrada';
      return `<div class="border-b last:border-0 py-1 flex justify-between items-center">
        <div><div class="font-medium">${l.nombre||'(sin nombre)'} ${abierta?'<span class="text-amber-600 text-xs">· borrador</span>':'<span class="text-emerald-600 text-xs">· cerrada</span>'}</div>
          <div class="text-xs text-slate-400">${l.fecha||''}</div></div>
        <div class="flex gap-1">${abierta?`<button data-open="${l.id}" class="text-emerald-700 text-xs border rounded px-2 py-1">Abrir</button>`:''}
          <button data-dell="${l.id}" class="text-red-400 text-xs px-1">🗑️</button></div></div>`;
    }).join('') || '<div class="text-slate-400">Aún no tienes listas. Crea una arriba.</div>';
    $$('#lHist [data-open]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.open; const ls2=await store.listas(); const h=ls2.find(x=>x.id===id); const items=await store.listaItems(id); listaActual={header:{...h}, items:items.map(it=>({...it}))}; pintarLista(); toast('Lista abierta para editar'); });
    $$('#lHist [data-dell]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Eliminar esta lista?'))return; await store.borrarLista(b.dataset.dell); if(listaActual.header.id===b.dataset.dell){nuevaLista();pintarLista();} cargarHist(); });
  }
}

      </div>
      <div>
        <div class="font-medium text-sm mb-1">💵 Billetes <span class="text-red-500 text-xs">(obligatorio)</span> — escribe cuántos de cada uno</div>
        <div id="kBill" class="grid grid-cols-5 gap-2 text-center text-sm"></div>
      </div>
      <div>
        <div class="font-medium text-sm mb-1">🪙 Monedas <span class="text-slate-400 text-xs">(opcional)</span></div>
        <div id="kMon" class="grid grid-cols-4 gap-2 text-center text-sm"></div>
      </div>
      <label class="text-sm block">¿Sacaron plata del efectivo hoy? (retiros)<input id="kRetiro" type="number" value="0" class="w-full border rounded-lg px-2 py-2"><span class="text-xs text-slate-400">Ej: pagar a un proveedor, gastos, sueldo. Déjalo en 0 si no sacaron nada.</span></label>
      <button id="kSave" class="w-full py-2 rounded-lg bg-[var(--verde)] text-white font-bold">Guardar cierre</button>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-4">
      <div id="kResumen" class="space-y-1 text-sm mb-4"></div>
      <div class="font-bold mb-2">Cierres anteriores</div>
      <div id="kHist" class="text-sm space-y-1 max-h-[45vh] overflow-y-auto"></div>
    </div>
  </div>`;

  const cell=(den,cls)=>`<div><div class="text-xs text-slate-500 mb-1">${CLP(den)}</div><input data-den="${den}" type="number" min="0" value="0" class="${cls} w-full border rounded-lg px-1 py-2 text-center"></div>`;
  $('#kBill').innerHTML=BILLETES.map(d=>cell(d,'kb')).join('');
  $('#kMon').innerHTML=MONEDAS.map(d=>cell(d,'km')).join('');

  const contado=()=>{ let s=0; $$('#kBill .kb, #kMon .km').forEach(el=>s+=(parseInt(el.value)||0)*(+el.dataset.den)); return s; };
  async function calcular(){
    const efe=contado(); const fondo=num($('#kFondo').value); const ret=num($('#kRetiro').value);
    const ventaCalc=efe+ret-fondo;
    const ventaSist=await store.ventasEfectivoDia($('#kFecha').value);
    const dif=ventaCalc-ventaSist; const okDif=Math.abs(dif)<=2000;
    $('#kResumen').innerHTML=`
      <div class="flex justify-between"><span>Efectivo contado</span><b>${CLP(efe)}</b></div>
      <div class="flex justify-between text-slate-500"><span>+ Retiros del día</span><span>${CLP(ret)}</span></div>
      <div class="flex justify-between text-slate-500"><span>− Fondo inicial</span><span>${CLP(fondo)}</span></div>
      <div class="flex justify-between border-t pt-1 text-base"><span class="font-medium">Venta efectivo (calculada)</span><b class="text-emerald-700">${CLP(ventaCalc)}</b></div>
      <div class="flex justify-between"><span>Venta efectivo (según ventas cargadas)</span><span>${CLP(ventaSist)}</span></div>
      <div class="flex justify-between border-t pt-1"><span class="font-medium">Diferencia</span><b class="${okDif?'text-emerald-600':'text-red-600'}">${CLP(dif)}</b></div>
      <div class="text-xs ${okDif?'text-slate-400':'text-red-500'}">${okDif?'✔ Cuadra bien.':'⚠ Hay descuadre: revisa el conteo, los retiros, o ventas marcadas con otro medio de pago.'}</div>`;
    return {efe,fondo,ret,ventaCalc,ventaSist,dif};
  }
  $$('#kBill .kb, #kMon .km').forEach(el=>el.addEventListener('input',calcular));
  ['kFondo','kRetiro','kFecha'].forEach(id=>$('#'+id).addEventListener('input',calcular));
  await calcular();

  $('#kSave').onclick=async()=>{
    const efe=contado(); if(efe<=0){toast('Cuenta al menos los billetes',false);return;}
    const r=await calcular(); const detalle={billetes:{},monedas:{}};
    $$('#kBill .kb').forEach(el=>detalle.billetes[el.dataset.den]=parseInt(el.value)||0);
    $$('#kMon .km').forEach(el=>detalle.monedas[el.dataset.den]=parseInt(el.value)||0);
    try{
      await store.guardarCierre({fecha:$('#kFecha').value, fondo_inicial:r.fondo, retiros:r.ret, efectivo_contado:r.efe,
        venta_efectivo_calculada:r.ventaCalc, venta_efectivo_sistema:r.ventaSist, diferencia:r.dif, detalle});
      toast('Cierre guardado'); cargarHist();
    }catch(e){toast('Error: '+e.message,false);}
  };

  async function cargarHist(){
    const cs=await store.cierres(40);
    $('#kHist').innerHTML=cs.map(c=>`<div class="border-b last:border-0 py-1">
      <div class="flex justify-between"><span class="font-medium">${c.fecha}</span><span class="text-emerald-700 font-medium">${CLP(c.venta_efectivo_calculada)}</span></div>
      <div class="text-xs text-slate-400">contado ${CLP(c.efectivo_contado)} · dif ${CLP(c.diferencia)}</div></div>`).join('')||'<div class="text-slate-400">Sin cierres todavía</div>';
  }
  cargarHist();
}

go('vender');
</script>
</body>
</html>
